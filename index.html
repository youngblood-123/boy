<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Marketing YB - Fast Version</title>
  <style>
    :root {
      --primary: #2196F3; --success: #10b981; --bg: #f5f7fa;
      --container-bg: #ffffff; --text: #2c3e50; --text-muted: #64748b; --border: #f0f0f0;
    }
    [data-theme="dark"] {
      --bg: #0f172a; --container-bg: #1e293b; --text: #f1f5f9; --text-muted: #94a3b8; --border: #334155;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 40px 20px; min-height: 100vh; transition: background 0.3s; }
    .container { max-width: 1000px; margin: 0 auto; background: var(--container-bg); border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); padding: 32px; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid var(--border); padding-bottom: 20px; }
    h1 { font-size: 24px; background: linear-gradient(90deg, #2196F3, #00BCD4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .btn-action { padding: 8px 16px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--container-bg); color: var(--text); cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn-action:hover { border-color: var(--primary); color: var(--primary); }

    .filter-group { margin-bottom: 25px; }
    .filter-label { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
    .filter-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-f { padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--container-bg); color: var(--text); cursor: pointer; font-size: 12px; font-weight: 700; }
    .btn-f.active { background: var(--primary); color: white; border-color: var(--primary); }

    .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
    .card { background: var(--container-bg); border: 1px solid var(--border); border-radius: 15px; padding: 15px; display: flex; align-items: center; justify-content: space-between; transition: transform 0.2s; }
    .card:hover { transform: translateY(-3px); border-color: var(--primary); }
    
    .info { display: flex; align-items: center; gap: 12px; }
    .preview { width: 45px; height: 45px; border-radius: 10px; border: 1px solid var(--border); padding: 4px; background: white; object-fit: contain; }
    .name-stack { display: flex; flex-direction: column; }
    .f-name { font-weight: 700; font-size: 14px; }
    .f-meta { font-size: 10px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; margin-top: 2px; }

    .copy-btn { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; font-size: 11px; font-weight: 700; }
    .copy-btn.success { background: var(--success); color: white; border-color: var(--success); }
  </style>
</head>
<body data-theme="light">

<div class="container">
  <header>
    <div>
      <h1>Marketing Ops - YB</h1>
    </div>
    <button onclick="toggleTheme()" class="btn-action" id="themeBtn">Dark Mode</button>
  </header>

  <div class="filter-group">
    <p class="filter-label">Filter by Brand</p>
    <div class="filter-btns">
      <button class="btn-f active" onclick="setFilter('brand', 'ALL', this)">All Brands</button>
      <button class="btn-f" onclick="setFilter('brand', 'BETSLOTS88', this)">BETSLOTS88</button>
      <button class="btn-f" onclick="setFilter('brand', 'TOTOWIN88', this)">TOTOWIN88</button>
      <button class="btn-f" onclick="setFilter('brand', 'KINGLIGA', this)">KINGLIGA</button>
    </div>
  </div>

  <div class="asset-grid" id="assetGrid"></div>

  <footer style="margin-top: 40px; text-align: center; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 20px;">
    &copy; 2026 Crafted by <b>Young Blood</b>
  </footer>
</div>

<script>
  // Data Aset Statis (Tanpa API)
  const assets = [
    { name: 'bca.webp', url: 'https://youngblood-g2352cm9ib.edgeone.dev/bca.webp', type: 'webp', brand: 'COMMON' },
    { name: 'bni.webp', url: 'https://youngblood-g2352cm9ib.edgeone.dev/bni.webp', type: 'webp', brand: 'COMMON' },
    { name: 'bri.webp', url: 'https://youngblood-g2352cm9ib.edgeone.dev/bri.webp', type: 'webp', brand: 'COMMON' },
    { name: 'mandiri.webp', url: 'https://youngblood-g2352cm9ib.edgeone.dev/mandiri.webp', type: 'webp', brand: 'COMMON' },
    { name: 'dana.webp', url: 'https://youngblood-g2352cm9ib.edgeone.dev/dana.webp', type: 'webp', brand: 'COMMON' },
    { name: 'qris.webp', url: 'https://youngblood-g2352cm9ib.edgeone.dev/qris.webp', type: 'webp', brand: 'COMMON' },
    { name: 'wa.gif', url: 'https://youngblood-g2352cm9ib.edgeone.dev/wa.gif', type: 'gif', brand: 'COMMON' },
    { name: 'tele.gif', url: 'https://youngblood-g2352cm9ib.edgeone.dev/tele.gif', type: 'gif', brand: 'COMMON' },
    { name: 'icon-betslots88.ico', url: 'https://youngblood-g2352cm9ib.edgeone.dev/icon-betslots88.ico', type: 'ico', brand: 'BETSLOTS88' },
    { name: 'icon-totowin88.ico', url: 'https://youngblood-g2352cm9ib.edgeone.dev/icon-totowin88.ico', type: 'ico', brand: 'TOTOWIN88' },
    { name: 'icon-kingliga.ico', url: 'https://youngblood-g2352cm9ib.edgeone.dev/icon-kingliga.ico', type: 'ico', brand: 'KINGLIGA' }
  ];

  let currentBrand = 'ALL';

  function render() {
    const grid = document.getElementById('assetGrid');
    const filtered = currentBrand === 'ALL' ? assets : assets.filter(a => a.brand === currentBrand);
    
    grid.innerHTML = filtered.map(a => `
      <div class="card">
        <div class="info">
          <img src="${a.url}" class="preview">
          <div class="name-stack">
            <span class="f-name">${a.name}</span>
            <span class="f-meta">${a.type} • ${a.brand}</span>
          </div>
        </div>
        <button class="copy-btn" onclick="copy('${a.url}', this)">Copy Link</button>
      </div>
    `).join('');
  }

  function setFilter(type, val, btn) {
    document.querySelectorAll('.btn-f').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentBrand = val;
    render();
  }

  function toggleTheme() {
    const isDark = document.body.getAttribute('data-theme') === 'dark';
    document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('themeBtn').innerText = isDark ? 'Dark Mode' : 'Light Mode';
  }

  function copy(url, btn) {
    navigator.clipboard.writeText(url).then(() => {
      btn.innerText = 'Copied!';
      btn.classList.add('success');
      setTimeout(() => { btn.innerText = 'Copy Link'; btn.classList.remove('success'); }, 1500);
    });
  }

  // Langsung jalankan tanpa loading API
  render();
</script>
</body>
</html>
