<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Asset Manager - Collection v2.0</title>
  <style>
    :root {
      --primary: #2196F3;
      --success: #10b981;
      --bg: #f5f7fa;
      --text: #2c3e50;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 40px 20px; }
    .container { max-width: 1100px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); padding: 32px; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    h1 { font-size: 28px; letter-spacing: -1px; }

    /* Search & Filter */
    .controls { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
    .search-wrapper { flex: 1; position: relative; min-width: 300px; }
    .search-input { width: 100%; padding: 12px 40px; border-radius: 12px; border: 1.5px solid #eee; outline: none; transition: 0.3s; font-size: 15px; }
    .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(33, 150, 243, 0.1); }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 20px; color: #94a3b8; }

    /* Tabs */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    .tab { padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; color: #64748b; transition: 0.3s; }
    .tab.active { background: var(--primary); color: white; }

    /* Table Styles */
    .file-list { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
    .file-list th { text-align: left; padding: 12px 20px; color: #64748b; font-size: 13px; text-transform: uppercase; }
    .file-list td { background: #fff; border-top: 1px solid #f0f0f0; border-bottom: 1px solid #f0f0f0; padding: 12px 20px; transition: 0.2s; }
    .file-list td:first-child { border-left: 1px solid #f0f0f0; border-radius: 12px 0 0 12px; }
    .file-list td:last-child { border-right: 1px solid #f0f0f0; border-radius: 0 12px 12px 0; }
    .file-list tr:hover td { background: #f8fafc; transform: translateY(-2px); }

    /* Components */
    .file-info { display: flex; align-items: center; gap: 15px; }
    .preview-box { width: 50px; height: 50px; border-radius: 8px; border: 1px solid #eee; object-fit: contain; background: #fafafa; padding: 4px; }
    .name-stack { display: flex; flex-direction: column; }
    .file-name { font-weight: 600; font-size: 14px; color: #1e293b; }
    .file-meta { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; background: #e2e8f0; color: #475569; text-transform: uppercase; }
    .badge-bank { background: #dbeafe; color: #1e40af; }
    .badge-wallet { background: #fef9c3; color: #854d0e; }
    .badge-promo { background: #dcfce7; color: #166534; }
    .badge-social { background: #f3e8ff; color: #6b21a8; }

    .action-group { display: flex; gap: 8px; justify-content: flex-end; }
    .btn-icon { padding: 8px; border-radius: 8px; border: 1px solid #e2e8f0; background: white; cursor: pointer; transition: 0.2s; color: #64748b; display: flex; align-items: center; justify-content: center; }
    .btn-icon:hover { background: #f1f5f9; color: var(--primary); border-color: var(--primary); }

    @keyframes successPop { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    .copied { color: var(--success) !important; border-color: var(--success) !important; animation: successPop 0.3s ease; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Asset Marketing Ops</h1>
    <div class="badge">v2.0 Professional</div>
  </header>

  <div class="controls">
    <div class="search-wrapper">
      <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <input type="text" id="fileSearch" class="search-input" placeholder="Cari aset (contoh: bca, dana, tele)..." onkeyup="filterFiles()">
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="filterTab('all', this)">All Assets</div>
    <div class="tab" onclick="filterTab('webp', this)">Images (WebP)</div>
    <div class="tab" onclick="filterTab('gif', this)">Animated (GIF)</div>
  </div>

  <table class="file-list" id="fileTable">
    <thead>
      <tr>
        <th>Asset & Details</th>
        <th>Category</th>
        <th style="text-align: right;">Quick Actions</th>
      </tr>
    </thead>
    <tbody id="assetBody">
      </tbody>
  </table>
</div>

<script>
  // Data aset bosku
  const assets = [
    { name: 'bca.webp', url: 'https://youngblood-dtacyyu4yu.edgeone.dev/bca.webp', type: 'webp', size: '12 KB', cat: 'BANK', badge: 'badge-bank' },
    { name: 'bni.webp', url: 'https://youngblood-dtacyyu4yu.edgeone.dev/bni.webp', type: 'webp', size: '11 KB', cat: 'BANK', badge: 'badge-bank' },
    { name: 'bri.webp', url: 'https://youngblood-dtacyyu4yu.edgeone.dev/bri.webp', type: 'webp', size: '13 KB', cat: 'BANK', badge: 'badge-bank' },
    { name: 'cimb.webp', url: 'https://youngblood-dtacyyu4yu.edgeone.dev/cimb.webp', type: 'webp', size: '12 KB', cat: 'BANK', badge: 'badge-bank' },
    { name: 'dana.webp', url: 'https://youngblood-dtacyyu4yu.edgeone.dev/dana.webp', type: 'webp', size: '9 KB', cat: 'E-WALLET', badge: 'badge-wallet' },
    { name: 'danamon.webp', url: 'https://youngblood-dtacyyu4yu.edgeone.dev/danamon.webp', type: 'webp', size: '11 KB', cat: 'BANK', badge: 'badge-bank' },
    { name: 'footer.webp', url: 'https://youngblood-dtacyyu4yu.edgeone.dev/footer.webp', type: 'webp', size: '42 KB', cat: 'LAYOUT', badge: '' },
    { name: 'gopay.webp', url: 'https://youngblood-dtacyyu4yu.edgeone.dev/gopay.webp', type: 'webp', size: '10 KB', cat: 'E-WALLET', badge: 'badge-wallet' },
    { name: 'linkaja.webp', url: 'https://youngblood-dtacyyu4yu.edgeone.dev/linkaja.webp', type: 'webp', size: '11 KB', cat: 'E-WALLET', badge: 'badge-wallet' },
    { name: 'mandiri.webp', url: 'https://youngblood-dtacyyu4yu.edgeone.dev/mandiri.webp', type: 'webp', size: '12 KB', cat: 'BANK', badge: 'badge-bank' },
    { name: 'online.webp', url: 'https://youngblood-dtacyyu4yu.edgeone.dev/online.webp', type: 'webp', size: '5 KB', cat: 'STATUS', badge: 'badge-promo' },
    { name: 'ovo.webp', url: 'https://youngblood-dtacyyu4yu.edgeone.dev/ovo.webp', type: 'webp', size: '10 KB', cat: 'E-WALLET', badge: 'badge-wallet' },
    { name: 'permata.webp', url: 'https://youngblood-dtacyyu4yu.edgeone.dev/permata.webp', type: 'webp', size: '12 KB', cat: 'BANK', badge: 'badge-bank' },
    { name: 'qris.webp', url: 'https://youngblood-dtacyyu4yu.edgeone.dev/qris.webp', type: 'webp', size: '15 KB', cat: 'PAYMENT', badge: 'badge-promo' },
    { name: 'tele.gif', url: 'https://youngblood-dtacyyu4yu.edgeone.dev/tele.gif', type: 'gif', size: '85 KB', cat: 'SOCIAL', badge: 'badge-social' },
    { name: 'wa.gif', url: 'https://youngblood-dtacyyu4yu.edgeone.dev/wa.gif', type: 'gif', size: '92 KB', cat: 'SOCIAL', badge: 'badge-social' },
    { name: 'icon-totowin88.ico', url: 'https://youngblood-dtacyyu4yu.edgeone.dev/icon-totowin88.ico', type: 'ico', size: '2 KB', cat: 'TOTOWIN88', badge: 'badge-social' },
  ];

  const assetBody = document.getElementById('assetBody');

  // Render aset ke tabel
  function renderAssets(data) {
    assetBody.innerHTML = data.map(asset => `
      <tr data-type="${asset.type}">
        <td>
          <div class="file-info">
            <img src="${asset.url}" class="preview-box" alt="preview">
            <div class="name-stack">
              <span class="file-name">${asset.name}</span>
              <span class="file-meta">${asset.type.toUpperCase()} • ${asset.size}</span>
            </div>
          </div>
        </td>
        <td><span class="badge ${asset.badge}">${asset.cat}</span></td>
        <td>
          <div class="action-group">
            <button class="btn-icon" title="Copy URL" onclick="copyValue('${asset.url}', this)">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            </button>
            <button class="btn-icon" title="Copy IMG Tag" onclick="copyValue('<img src=\\'${asset.url}\\' alt=\\'${asset.name.split('.')[0]}\\'>', this)">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
            </button>
            <a href="${asset.url}" target="_blank" class="btn-icon" title="Open Link">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
            </a>
          </div>
        </td>
      </tr>
    `).join('');
  }

  // Load awal
  renderAssets(assets);

  // Copy Function
  function copyValue(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      btn.classList.add('copied');
      const oldHTML = btn.innerHTML;
      btn.innerHTML = '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = oldHTML;
      }, 1500);
    });
  }

  // Search
  function filterFiles() {
    const query = document.getElementById('fileSearch').value.toLowerCase();
    const filtered = assets.filter(a => a.name.toLowerCase().includes(query) || a.cat.toLowerCase().includes(query));
    renderAssets(filtered);
  }

  // Tabs
  function filterTab(type, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    if(type === 'all') renderAssets(assets);
    else renderAssets(assets.filter(a => a.type === type));
  }
</script>
</body>
</html>
