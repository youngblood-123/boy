<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YB Asset</title>
  <style>
    :root {
      --primary: #d32f2f;
      --gold-main: #fbc02d;
      --gold-soft: #fff59d;
      --bg: #f5f7fa;
      --container-bg: #ffffff;
      --text: #2c3e50;
      --text-muted: #64748b;
      --border: #f0f0f0;
      --card-hover: #f8fafc;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --container-bg: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
      --card-hover: #0f172a;
    }

    #access-gate {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #000; background-size: cover; background-position: center;
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; overflow: hidden;
    }

    .cny-rain {
      position: absolute; top: -100px;
      user-select: none; pointer-events: none;
      z-index: 5; animation: fall linear forwards;
    }
    .cny-rain img { width: 50px; height: 50px; object-fit: contain; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3)); }

    @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

    .gate-card {
      background: rgba(20, 0, 0, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding: 50px 40px; border-radius: 40px; border: 2px solid var(--gold-main);
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.9); text-align: center; width: 90%; max-width: 450px;
      position: relative; z-index: 10; animation: emerge 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .horse-frame {
      width: 180px; height: 180px; margin: 0 auto 25px; position: relative;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; overflow: hidden; border: 6px solid var(--gold-main);
      box-shadow: 0 0 30px var(--gold-main); background: #000;
    }
    
    .horse-frame::after {
      content: ''; position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px;
      border: 2px solid var(--gold-main); border-radius: 50%;
      animation: spin 12s linear infinite; border-style: double; z-index: 11; pointer-events: none;
    }

    .kuda-logo { width: 140%; height: 140%; object-fit: cover; display: block; position: relative; z-index: 10; filter: brightness(1.1) contrast(1.1); }
    .gate-card h2 { color: var(--gold-soft); font-family: 'Playfair Display', serif; letter-spacing: 5px; text-transform: uppercase; font-size: 20px; }

    .gate-input {
      width: 100%; padding: 16px; border-radius: 12px; border: 1px solid var(--gold-main);
      background: rgba(255, 255, 255, 0.05); color: #fff; text-align: center; font-size: 18px;
      margin: 25px 0 15px; outline: none; letter-spacing: 8px; font-weight: bold;
    }

    .gate-btn {
      width: 100%; padding: 16px; border-radius: 12px; border: none;
      background: linear-gradient(90deg, #8b0000, #d32f2f, #8b0000); background-size: 200% auto;
      color: #fff; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.5s;
    }
    .gate-btn:hover { background-position: right center; transform: scale(1.02); }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes emerge { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    .hidden { opacity: 0 !important; transform: scale(1.2) !important; transition: 1.2s !important; pointer-events: none; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: all 0.2s ease; }
    body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; background: var(--container-bg); border-radius: 20px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    h1 { font-size: 24px; letter-spacing: -1px; background: linear-gradient(90deg, var(--primary), var(--gold-main)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .theme-toggle { cursor: pointer; padding: 8px 16px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--container-bg); color: var(--text); font-weight: 600; font-size: 12px; }

    .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
    .search-input { width: 100%; padding: 12px 20px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--container-bg); color: var(--text); outline: none; }

    .filter-group { display: flex; flex-direction: column; gap: 8px; }
    .filter-label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .filter-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-filter { padding: 6px 12px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--container-bg); color: var(--text); cursor: pointer; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .btn-filter:hover, .btn-filter.active { background: var(--primary); color: white; border-color: var(--primary); }

    .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; flex-wrap: wrap; }
    .tab { padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--text-muted); }
    .tab.active { background: var(--primary); color: white; }

    .asset-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    @media (min-width: 768px) { .asset-grid { grid-template-columns: 1fr 1fr; } }

    .asset-card { background: var(--container-bg); border: 1px solid var(--border); border-radius: 15px; padding: 15px; display: flex; align-items: center; justify-content: space-between; }
    .asset-card:hover { border-color: var(--primary); transform: translateY(-2px); background: var(--card-hover); }

    .file-info { display: flex; align-items: center; gap: 12px; overflow: hidden; }
    .preview-box { width: 48px; height: 48px; border-radius: 10px; border: 1px solid var(--border); object-fit: contain; background: white; padding: 4px; flex-shrink: 0; }
    .name-stack { display: flex; flex-direction: column; overflow: hidden; }
    .file-name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .badge { padding: 3px 8px; border-radius: 5px; font-size: 9px; font-weight: 800; text-transform: uppercase; margin-top: 4px; width: fit-content; }
    .badge-bank { background: #fee2e2; color: #991b1b; }
    .badge-wallet { background: #fef9c3; color: #854d0e; }
    .badge-other { background: #f3f4f6; color: #374151; }

    .action-group { display: flex; gap: 6px; }
    .btn-icon { padding: 8px 15px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--container-bg); color: var(--text-muted); cursor: pointer; font-size: 11px; font-weight: 700; }
    .copied { color: var(--success) !important; border-color: var(--success) !important; }

    footer { margin-top: 40px; text-align: center; color: var(--text-muted); font-size: 12px; }
  </style>
</head>
<body data-theme="light">

<div id="access-gate">
  <div id="rain-container"></div>
  <div class="gate-card">
    <div class="horse-frame">
      <img id="mainHorseLogo" src="" class="kuda-logo">
    </div>
    <h2>AUTHENTICATION</h2>
    <input type="password" id="gatePass" class="gate-input" placeholder="••••••">
    <button onclick="validateGate()" class="gate-btn">Unlock Dashboard</button>
  </div>
</div>

<div class="container">
  <header>
    <h1>Asset Marketing YB</h1>
    <div style="display: flex; gap: 10px;">
      <button onclick="logout()" class="theme-toggle" style="color: #ef4444; border-color:#ef4444;">Logout</button>
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">Dark Mode</button>
    </div>
  </header>

  <div class="controls">
    <input type="text" id="fileSearch" class="search-input" placeholder="Cari aset..." onkeyup="applyFilters()">
    
    <div class="filter-group">
      <p class="filter-label">Filter Brand</p>
      <div class="filter-buttons">
        <button class="btn-filter active" onclick="setFilter('brand', 'ALL', this)">All Brands</button>
        <button class="btn-filter" onclick="setFilter('brand', 'BETSLOTS88', this)">BETSLOTS88</button>
        <button class="btn-filter" onclick="setFilter('brand', 'TOTOWIN88', this)">TOTOWIN88</button>
        <button class="btn-filter" onclick="setFilter('brand', 'KINGLIGA', this)">KINGLIGA</button>
      </div>
    </div>

    <div class="filter-group">
      <p class="filter-label">Filter Category</p>
      <div class="filter-buttons">
        <button class="btn-filter active" onclick="setFilter('cat', 'ALL', this)">All Category</button>
        <button class="btn-filter" onclick="setFilter('cat', 'BANK', this)">BANK</button>
        <button class="btn-filter" onclick="setFilter('cat', 'E-WALLET', this)">E-WALLET</button>
        <button class="btn-filter" onclick="setFilter('cat', 'OTHER', this)">OTHER</button>
      </div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="setFilter('type', 'all', this)">All Types</div>
    <div class="tab" onclick="setFilter('type', 'webp', this)">WebP</div>
    <div class="tab" onclick="setFilter('type', 'gif', this)">GIF</div>
    <div class="tab" onclick="setFilter('type', 'ico', this)">ICO</div>
  </div>

  <div class="asset-grid" id="assetBody"></div>

  <footer>
    <p>&copy; 2026 Crafted by <b>Young Blood</b> | Premium Secured</p>
  </footer>
</div>

<script>
  const SECURE_KEY = "16be8ee8aff23b80a51a5310c55e3132321e2ba9f1d2954eca98cb21f56c00d7";
  const base = "https://youngblood-ofhjjzvfc6.edgeone.dev/";
  
  const bgFileName = "background.jpg"; 
  const horseLogoName = "logo-kuda.png";
  const cnyAssets = ['angpao.png', 'ingot.png', 'kuda.png', 'kipass.png', 'lampionn.png', 'orange.png', 'money.png'];

  function setupAssets() {
    const gate = document.getElementById('access-gate');
    const logo = document.getElementById('mainHorseLogo');
    gate.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('${base}${bgFileName}')`;
    logo.src = `${base}${horseLogoName}`;
  }

  function createRain() {
    const container = document.getElementById('rain-container');
    const assetName = cnyAssets[Math.floor(Math.random() * cnyAssets.length)];
    const item = document.createElement('div');
    item.className = 'cny-rain';
    item.innerHTML = `<img src="${base}${assetName}">`;
    item.style.left = Math.random() * 100 + 'vw';
    item.style.animationDuration = Math.random() * 3 + 4 + 's';
    item.style.opacity = Math.random() * 0.7 + 0.3;
    container.appendChild(item);
    setTimeout(() => item.remove(), 7000);
  }

  async function validateGate() {
    const input = document.getElementById('gatePass').value.trim();
    const msgBuffer = new TextEncoder().encode(input);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashedInput = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

    if(hashedInput === SECURE_KEY) {
      sessionStorage.setItem('yb_auth', 'true');
      document.getElementById('access-gate').classList.add('hidden');
      setTimeout(() => { document.getElementById('access-gate').style.display = 'none'; }, 1500);
      renderAssets(assets);
    } else { alert("WARNING: ACCESS CODE INVALID"); }
  }

  function checkAuth() {
    if(sessionStorage.getItem('yb_auth') === 'true') {
      document.getElementById('access-gate').style.display = 'none';
      renderAssets(assets);
    }
  }

  function logout() { sessionStorage.removeItem('yb_auth'); location.reload(); }

  const assets = [
    { name: 'bca.webp', cat: 'BANK', type: 'webp', brand: 'COMMON', b: 'badge-bank' },
    { name: 'bni.webp', cat: 'BANK', type: 'webp', brand: 'COMMON', b: 'badge-bank' },
    { name: 'bri.webp', cat: 'BANK', type: 'webp', brand: 'COMMON', b: 'badge-bank' },
    { name: 'cimb.webp', cat: 'BANK', type: 'webp', brand: 'COMMON', b: 'badge-bank' },
    { name: 'mandiri.webp', cat: 'BANK', type: 'webp', brand: 'COMMON', b: 'badge-bank' },
    { name: 'danamon.webp', cat: 'BANK', type: 'webp', brand: 'COMMON', b: 'badge-bank' },
    { name: 'permata.webp', cat: 'BANK', type: 'webp', brand: 'COMMON', b: 'badge-bank' },
    { name: 'dana.webp', cat: 'E-WALLET', type: 'webp', brand: 'COMMON', b: 'badge-wallet' },
    { name: 'gopay.webp', cat: 'E-WALLET', type: 'webp', brand: 'COMMON', b: 'badge-wallet' },
    { name: 'ovo.webp', cat: 'E-WALLET', type: 'webp', brand: 'COMMON', b: 'badge-wallet' },
    { name: 'linkaja.webp', cat: 'E-WALLET', type: 'webp', brand: 'COMMON', b: 'badge-wallet' },
    { name: 'qris.webp', cat: 'E-WALLET', type: 'webp', brand: 'COMMON', b: 'badge-wallet' },
    { name: 'wa.gif', cat: 'OTHER', type: 'gif', brand: 'COMMON', b: 'badge-other' },
    { name: 'tele.gif', cat: 'OTHER', type: 'gif', brand: 'COMMON', b: 'badge-other' },
    { name: 'online.webp', cat: 'OTHER', type: 'webp', brand: 'COMMON', b: 'badge-other' },
    { name: 'footer.webp', cat: 'OTHER', type: 'webp', brand: 'COMMON', b: 'badge-other' },
    { name: 'icon-betslots88.ico', cat: 'OTHER', type: 'ico', brand: 'BETSLOTS88', b: 'badge-other' },
    { name: 'icon-totowin88.ico', cat: 'OTHER', type: 'ico', brand: 'TOTOWIN88', b: 'badge-other' },
    { name: 'icon-kingliga.ico', cat: 'OTHER', type: 'ico', brand: 'KINGLIGA', b: 'badge-other' },
    { name: 'logo-betslots88.webp', cat: 'OTHER', type: 'webp', brand: 'BETSLOTS88', b: 'badge-other' },
    { name: 'logo-totowin88.webp', cat: 'OTHER', type: 'webp', brand: 'TOTOWIN88', b: 'badge-other' },
    { name: 'logo-kingliga.webp', cat: 'OTHER', type: 'webp', brand: 'KINGLIGA', b: 'badge-other' },
    { name: 'logo-totomacau.webp', cat: 'OTHER', type: 'webp', brand: 'COMMON', b: 'badge-other' },
  ];

  let filters = { brand: 'ALL', cat: 'ALL', type: 'all' };

  function renderAssets(data) {
    const grid = document.getElementById('assetBody');
    grid.innerHTML = data.map(asset => {
      const fullUrl = base + asset.name;
      const displayTag = asset.brand !== 'COMMON' ? asset.brand : asset.cat;
      return `
      <div class="asset-card">
        <div class="file-info">
          <img src="${fullUrl}" class="preview-box" loading="lazy">
          <div class="name-stack">
            <span class="file-name">${asset.name}</span>
            <span class="badge ${asset.b}">${displayTag}</span>
          </div>
        </div>
        <div class="action-group">
          <button class="btn-icon" onclick="copyValue('${fullUrl}', this)">Copy</button>
          <a href="${fullUrl}" target="_blank" class="btn-icon" style="text-decoration:none;">Link</a>
        </div>
      </div>`;
    }).join('');
  }

  function setFilter(key, val, btn) {
    const parent = btn.parentElement;
    parent.querySelectorAll('.btn-filter, .tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filters[key] = val;
    applyFilters();
  }

  function applyFilters() {
    const query = document.getElementById('fileSearch').value.toLowerCase();
    const filtered = assets.filter(a => {
      const matchBrand = filters.brand === 'ALL' || a.brand === filters.brand;
      const matchCat = filters.cat === 'ALL' || a.cat === filters.cat;
      const matchType = filters.type === 'all' || a.type === filters.type;
      const matchSearch = a.name.toLowerCase().includes(query) || a.brand.toLowerCase().includes(query);
      return matchBrand && matchCat && matchType && matchSearch;
    });
    renderAssets(filtered);
  }

  function toggleTheme() {
    const isDark = document.body.getAttribute('data-theme') === 'dark';
    document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('themeBtn').innerText = isDark ? 'Dark Mode' : 'Light Mode';
  }

  function copyValue(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      btn.innerText = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.innerText = 'Copy'; btn.classList.remove('copied'); }, 1500);
    });
  }

  document.getElementById('gatePass').addEventListener('keypress', (e) => { if(e.key === 'Enter') validateGate(); });

  window.onload = () => {
    setupAssets();
    setInterval(createRain, 300);
    checkAuth();
  };
</script>
</body>
</html>
