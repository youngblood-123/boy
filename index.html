<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Marketing YB - Pro v5.0</title>
  <style>
    :root {
      --primary: #2196F3;
      --success: #10b981;
      --bg: #f5f7fa;
      --container-bg: #ffffff;
      --text: #2c3e50;
      --text-muted: #64748b;
      --border: #f0f0f0;
      --card-hover: #f8fafc;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --container-bg: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
      --card-hover: #0f172a;
    }

    /* KODE TAMBAHAN UNTUK AKSES GATE */
    #access-gate {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); display: flex; align-items: center; justify-content: center;
      z-index: 9999; transition: 0.5s;
    }
    .gate-card {
      background: var(--container-bg); padding: 40px; border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px;
    }
    .gate-card h2 { margin-bottom: 20px; font-size: 22px; color: var(--text); }
    .gate-input {
      width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid var(--border);
      background: var(--bg); color: var(--text); text-align: center; font-size: 16px; margin-bottom: 20px; outline: none;
    }
    .gate-input:focus { border-color: var(--primary); }
    .gate-btn {
      width: 100%; padding: 12px; border-radius: 12px; border: none;
      background: var(--primary); color: white; font-weight: 700; cursor: pointer;
    }
    .hidden { opacity: 0; pointer-events: none; }
    /* AKHIR KODE TAMBAHAN */

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: all 0.2s ease; }
    body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; background: var(--container-bg); border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); padding: 25px; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    h1 { font-size: 24px; letter-spacing: -1px; background: linear-gradient(90deg, #2196F3, #00BCD4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .theme-toggle { cursor: pointer; padding: 8px 16px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--container-bg); color: var(--text); font-weight: 600; font-size: 12px; }

    .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
    .search-wrapper { position: relative; width: 100%; }
    .search-input { width: 100%; padding: 12px 45px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--container-bg); color: var(--text); outline: none; font-size: 14px; }
    .search-input:focus { border-color: var(--primary); }
    .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 18px; color: var(--text-muted); }

    .filter-group { display: flex; flex-direction: column; gap: 8px; }
    .filter-label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .filter-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    
    .btn-filter { padding: 6px 12px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--container-bg); color: var(--text); cursor: pointer; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .btn-filter:hover, .btn-filter.active { background: var(--primary); color: white; border-color: var(--primary); }

    .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; flex-wrap: wrap; }
    .tab { padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--text-muted); }
    .tab.active { background: var(--primary); color: white; }

    .asset-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    @media (min-width: 768px) {
      .asset-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .asset-card {
      background: var(--container-bg);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .asset-card:hover {
      border-color: var(--primary);
      background: var(--card-hover);
      transform: translateY(-2px);
    }

    .file-info { display: flex; align-items: center; gap: 12px; overflow: hidden; }
    .preview-box { width: 48px; height: 48px; border-radius: 10px; border: 1px solid var(--border); object-fit: contain; background: white; padding: 4px; flex-shrink: 0; }
    .name-stack { display: flex; flex-direction: column; overflow: hidden; }
    .file-name { font-weight: 700; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .badge { padding: 3px 8px; border-radius: 5px; font-size: 9px; font-weight: 800; text-transform: uppercase; width: fit-content; margin-top: 4px; }
    .badge-bank { background: #dbeafe; color: #1e40af; }
    .badge-wallet { background: #fef9c3; color: #854d0e; }
    .badge-betslots { background: #dcfce7; color: #166534; }
    .badge-totowin { background: #fee2e2; color: #991b1b; }
    .badge-kingliga { background: #fdf2f8; color: #9d174d; }
    .badge-social { background: #f3e8ff; color: #6b21a8; }

    .right-section { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
    .action-group { display: flex; gap: 6px; }
    .btn-icon { padding: 8px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--container-bg); color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-icon:hover { color: var(--primary); border-color: var(--primary); }

    footer { margin-top: 40px; padding-top: 20px; text-align: center; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 12px; }
    .copied { color: var(--success) !important; border-color: var(--success) !important; }
  </style>
</head>
<body data-theme="light">

<div id="access-gate">
  <div class="gate-card">
    <h2>🔐 Secure Access</h2>
    <input type="password" id="gatePass" class="gate-input" placeholder="Enter Password">
    <button onclick="validateGate()" class="gate-btn">Unlock Dashboard</button>
  </div>
</div>

<div class="container">
  <header>
    <h1>Marketing Asset YB</h1>
    <div style="display: flex; gap: 10px;">
      <button onclick="logout()" class="theme-toggle" style="color: #ef4444;">Logout</button>
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">Dark Mode</button>
    </div>
  </header>

  <div class="controls">
    <div class="search-wrapper">
      <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <input type="text" id="fileSearch" class="search-input" placeholder="Cari aset (nama, brand, atau kategori)..." onkeyup="applyFilters()">
    </div>
    
    <div class="filter-group">
      <p class="filter-label">Filter Brand</p>
      <div class="filter-buttons">
        <button class="btn-filter active" onclick="setFilter('brand', 'ALL', this)">All Brands</button>
        <button class="btn-filter" onclick="setFilter('brand', 'BETSLOTS88', this)">BETSLOTS88</button>
        <button class="btn-filter" onclick="setFilter('brand', 'TOTOWIN88', this)">TOTOWIN88</button>
        <button class="btn-filter" onclick="setFilter('brand', 'KINGLIGA', this)">KINGLIGA</button>
      </div>
    </div>

    <div class="filter-group">
      <p class="filter-label">Filter Category</p>
      <div class="filter-buttons">
        <button class="btn-filter active" onclick="setFilter('cat', 'ALL', this)">All Categories</button>
        <button class="btn-filter" onclick="setFilter('cat', 'BANK', this)">BANK</button>
        <button class="btn-filter" onclick="setFilter('cat', 'E-WALLET', this)">E-WALLET</button>
        <button class="btn-filter" onclick="setFilter('cat', 'SOCIAL', this)">SOCIAL</button>
      </div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="setFilter('type', 'all', this)">All File Types</div>
    <div class="tab" onclick="setFilter('type', 'webp', this)">WebP</div>
    <div class="tab" onclick="setFilter('type', 'gif', this)">GIF</div>
    <div class="tab" onclick="setFilter('type', 'ico', this)">ICO</div>
  </div>

  <div class="asset-grid" id="assetBody">
    </div>

  <footer>
    <p>&copy; 2026 Crafted by <b>Young Blood</b></p>
  </footer>
</div>



<script>
  /* LOGIKA AKSES GATE SHA-256 */
  // Hash SHA-256 dari password "YB2026"
  const SECURE_KEY = "1b463288f3493867c54326f5950882e557b7f8c5b6f007358117d727b10214c7";

  async function hashString(str) {
    const msgBuffer = new TextEncoder().encode(str);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function validateGate() {
    const input = document.getElementById('gatePass').value;
    const hashedInput = await hashString(input);
    if(hashedInput === SECURE_KEY) {
      sessionStorage.setItem('yb_auth', 'true');
      document.getElementById('access-gate').classList.add('hidden');
    } else {
      alert("Password Salah!");
    }
  }

  function checkAuth() {
    if(sessionStorage.getItem('yb_auth') === 'true') {
      document.getElementById('access-gate').classList.add('hidden');
    }
  }

  function logout() {
    sessionStorage.removeItem('yb_auth');
    location.reload();
  }

  // Izinkan tekan "Enter" untuk login
  document.getElementById('gatePass')?.addEventListener('keypress', function (e) {
    if (e.key === 'Enter') validateGate();
  });

  /* KODE ASLI ANDA */
  const assets = [
    { name: 'bca.webp', url: 'https://youngblood-falsb9fy5y.edgeone.dev/bca.webp', type: 'webp', cat: 'BANK', brand: 'COMMON', badge: 'badge-bank' },
    { name: 'bni.webp', url: 'https://youngblood-falsb9fy5y.edgeone.dev/bni.webp', type: 'webp', cat: 'BANK', brand: 'COMMON', badge: 'badge-bank' },
    { name: 'bri.webp', url: 'https://youngblood-falsb9fy5y.edgeone.dev/bri.webp', type: 'webp', cat: 'BANK', brand: 'COMMON', badge: 'badge-bank' },
    { name: 'mandiri.webp', url: 'https://youngblood-falsb9fy5y.edgeone.dev/mandiri.webp', type: 'webp', cat: 'BANK', brand: 'COMMON', badge: 'badge-bank' },
    { name: 'dana.webp', url: 'https://youngblood-falsb9fy5y.edgeone.dev/dana.webp', type: 'webp', cat: 'E-WALLET', brand: 'COMMON', badge: 'badge-wallet' },
    { name: 'gopay.webp', url: 'https://youngblood-falsb9fy5y.edgeone.dev/gopay.webp', type: 'webp', cat: 'E-WALLET', brand: 'COMMON', badge: 'badge-wallet' },
    { name: 'qris.webp', url: 'https://youngblood-falsb9fy5y.edgeone.dev/qris.webp', type: 'webp', cat: 'E-WALLET', brand: 'COMMON', badge: 'badge-wallet' },
    { name: 'icon-betslots88.ico', url: 'https://youngblood-falsb9fy5y.edgeone.dev/icon-betslots88.ico', type: 'ico', cat: 'ICON', brand: 'BETSLOTS88', badge: 'badge-betslots' },
    { name: 'icon-totowin88.ico', url: 'https://youngblood-falsb9fy5y.edgeone.dev/icon-totowin88.ico', type: 'ico', cat: 'ICON', brand: 'TOTOWIN88', badge: 'badge-totowin' },
    { name: 'icon-kingliga.ico', url: 'https://youngblood-falsb9fy5y.edgeone.dev/icon-kingliga.ico', type: 'ico', cat: 'ICON', brand: 'KINGLIGA', badge: 'badge-kingliga' },
    { name: 'wa.gif', url: 'https://youngblood-falsb9fy5y.edgeone.dev/wa.gif', type: 'gif', cat: 'SOCIAL', brand: 'COMMON', badge: 'badge-social' },
    { name: 'tele.gif', url: 'https://youngblood-falsb9fy5y.edgeone.dev/tele.gif', type: 'gif', cat: 'SOCIAL', brand: 'COMMON', badge: 'badge-social' }
  ];

  let filters = { brand: 'ALL', cat: 'ALL', type: 'all' };

  function renderAssets(data) {
    const assetBody = document.getElementById('assetBody');
    assetBody.innerHTML = data.map(asset => `
      <div class="asset-card">
        <div class="file-info">
          <img src="${asset.url}" class="preview-box" loading="lazy" onerror="this.src='https://via.placeholder.com/50?text=IMG'">
          <div class="name-stack">
            <span class="file-name">${asset.name}</span>
            <span class="badge ${asset.badge}">${asset.brand !== 'COMMON' ? asset.brand : asset.cat}</span>
          </div>
        </div>
        
        <div class="right-section">
          <div class="action-group">
            <button class="btn-icon" title="Copy URL" onclick="copyValue('${asset.url}', this)">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            </button>
            <a href="${asset.url}" target="_blank" class="btn-icon">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
            </a>
          </div>
          <span style="font-size: 9px; font-weight: 800; color: var(--text-muted);">${asset.type.toUpperCase()}</span>
        </div>
      </div>
    `).join('');
  }

  function setFilter(key, value, btn) {
    const parent = btn.parentElement;
    parent.querySelectorAll('.btn-filter, .tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filters[key] = value;
    applyFilters();
  }

  function applyFilters() {
    const query = document.getElementById('fileSearch').value.toLowerCase();
    const filtered = assets.filter(a => {
      const matchBrand = filters.brand === 'ALL' || a.brand === filters.brand;
      const matchCat = filters.cat === 'ALL' || a.cat === filters.cat;
      const matchType = filters.type === 'all' || a.type === filters.type;
      const matchSearch = a.name.toLowerCase().includes(query) || a.cat.toLowerCase().includes(query) || a.brand.toLowerCase().includes(query);
      return matchBrand && matchCat && matchType && matchSearch;
    });
    renderAssets(filtered);
  }

  function toggleTheme() {
    const isDark = document.body.getAttribute('data-theme') === 'dark';
    document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('themeBtn').innerText = isDark ? 'Dark Mode' : 'Light Mode';
  }

  function copyValue(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      btn.classList.add('copied');
      setTimeout(() => btn.classList.remove('copied'), 1500);
    });
  }

  // Jalankan Auth Check dan Render
  checkAuth();
  renderAssets(assets);
</script>
</body>
</html>
