<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YB Asset</title>
  <style>
    :root {
      --primary: #d32f2f;
      --gold-main: #fbc02d;
      --gold-soft: #fff59d;
      --bg: #f5f7fa;
      --container-bg: #ffffff;
      --text: #2c3e50;
      --border: #f0f0f0;
    }

    #access-gate {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #000;
      background-size: cover; 
      background-position: center;
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; overflow: hidden;
    }

    .cny-rain {
      position: absolute; top: -100px;
      user-select: none; pointer-events: none;
      z-index: 5; animation: fall linear forwards;
    }
    .cny-rain img { 
      width: 50px; height: 50px; 
      object-fit: contain;
      filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); }
    }

    .gate-card {
      background: rgba(20, 0, 0, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 50px 40px; border-radius: 40px;
      border: 2px solid var(--gold-main);
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
      text-align: center; width: 90%; max-width: 450px;
      position: relative; z-index: 10;
      animation: emerge 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .horse-frame {
      width: 180px; height: 180px;
      margin: 0 auto 25px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      overflow: hidden;
      border: 6px solid var(--gold-main);
      box-shadow: 0 0 30px var(--gold-main);
      background: #000;
    }
    
    .horse-frame::after {
      content: ''; position: absolute; 
      top: -10px; left: -10px; right: -10px; bottom: -10px;
      border: 2px solid var(--gold-main); border-radius: 50%;
      animation: spin 12s linear infinite; border-style: double;
      z-index: 11;
      pointer-events: none;
    }

    .kuda-logo {
      width: 140%; height: 140%;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 10;
      filter: brightness(1.1) contrast(1.1);
    }

    .gate-card h2 {
      color: var(--gold-soft); font-family: 'Playfair Display', serif;
      letter-spacing: 5px; text-transform: uppercase; font-size: 20px;
    }

    .gate-input {
      width: 100%; padding: 16px; border-radius: 12px;
      border: 1px solid var(--gold-main);
      background: rgba(255, 255, 255, 0.05); color: #fff;
      text-align: center; font-size: 18px; margin: 25px 0 15px;
      outline: none; letter-spacing: 8px; font-weight: bold;
    }

    .gate-btn {
      width: 100%; padding: 16px; border-radius: 12px; border: none;
      background: linear-gradient(90deg, #8b0000, #d32f2f, #8b0000);
      background-size: 200% auto; color: #fff;
      font-weight: 900; cursor: pointer; text-transform: uppercase;
      letter-spacing: 2px; transition: 0.5s;
    }
    .gate-btn:hover { background-position: right center; transform: scale(1.02); }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes emerge { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    .hidden { opacity: 0 !important; transform: scale(1.2) !important; transition: 1.2s !important; pointer-events: none; }

    /* DASHBOARD */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; background: var(--container-bg); border-radius: 20px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
    .asset-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    @media (min-width: 768px) { .asset-grid { grid-template-columns: 1fr 1fr; } }
    .asset-card { background: var(--container-bg); border: 1px solid var(--border); border-radius: 15px; padding: 15px; display: flex; align-items: center; justify-content: space-between; }
    .preview-box { width: 48px; height: 48px; border-radius: 10px; object-fit: contain; }
  </style>
</head>
<body>

<div id="access-gate">
  <div id="rain-container"></div>
  <div class="gate-card">
    <div class="horse-frame">
      <img id="mainHorseLogo" src="" class="kuda-logo">
    </div>
    <h2>AUTHENTICATION</h2>
    <input type="password" id="gatePass" class="gate-input" placeholder="••••••">
    <button onclick="validateGate()" class="gate-btn">Unlock Dashboard</button>
  </div>
</div>

<div class="container">
  <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
    <h1 style="font-size: 22px; color: var(--primary);">Asset Marketing YB</h1>
    <button onclick="logout()" style="cursor:pointer; color:#d32f2f; background:none; border:1px solid #d32f2f; padding: 5px 15px; border-radius: 8px; font-weight:700;">LOGOUT</button>
  </header>
  <div class="asset-grid" id="assetBody"></div>
</div>

<script>
  const SECURE_KEY = "16be8ee8aff23b80a51a5310c55e3132321e2ba9f1d2954eca98cb21f56c00d7";
  const base = "https://youngblood-ii2wfztlfu.edgeone.dev/";
  
  const bgFileName = "background.jpg"; 
  const horseLogoName = "logo-kuda.png";
  const cnyAssets = ['angpao.png', 'ingot.png', 'kuda.png', 'kipass.png', 'lampionn.png', 'orange.png', 'money.png'];

  function setupAssets() {
    const gate = document.getElementById('access-gate');
    const logo = document.getElementById('mainHorseLogo');
    gate.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('${base}${bgFileName}')`;
    logo.src = `${base}${horseLogoName}`;
  }

  function createRain() {
    const container = document.getElementById('rain-container');
    const assetName = cnyAssets[Math.floor(Math.random() * cnyAssets.length)];
    const item = document.createElement('div');
    item.className = 'cny-rain';
    item.innerHTML = `<img src="${base}${assetName}">`;
    item.style.left = Math.random() * 100 + 'vw';
    item.style.animationDuration = Math.random() * 3 + 4 + 's';
    item.style.opacity = Math.random() * 0.7 + 0.3;
    container.appendChild(item);
    setTimeout(() => item.remove(), 7000);
  }

  async function validateGate() {
    const input = document.getElementById('gatePass').value.trim();
    const msgBuffer = new TextEncoder().encode(input);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashedInput = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

    if(hashedInput === SECURE_KEY) {
      sessionStorage.setItem('yb_auth', 'true');
      document.getElementById('access-gate').classList.add('hidden');
      setTimeout(() => { document.getElementById('access-gate').style.display = 'none'; }, 1500);
      renderAssets(assets);
    } else {
      alert("WARNING: ACCESS CODE INVALID");
    }
  }

  function checkAuth() {
    if(sessionStorage.getItem('yb_auth') === 'true') {
      document.getElementById('access-gate').style.display = 'none';
      renderAssets(assets);
    }
  }

  function logout() { sessionStorage.removeItem('yb_auth'); location.reload(); }

  const assets = [
    { name: 'bca.webp', cat: 'BANK' }, { name: 'bni.webp', cat: 'BANK' },
    { name: 'bri.webp', cat: 'BANK' }, { name: 'cimb.webp', cat: 'BANK' },
    { name: 'mandiri.webp', cat: 'BANK' }, { name: 'danamon.webp', cat: 'BANK' },
    { name: 'permata.webp', cat: 'BANK' }, { name: 'dana.webp', cat: 'E-WALLET' },
    { name: 'gopay.webp', cat: 'E-WALLET' }, { name: 'ovo.webp', cat: 'E-WALLET' },
    { name: 'linkaja.webp', cat: 'E-WALLET' }, { name: 'qris.webp', cat: 'E-WALLET' },
    { name: 'wa.gif', cat: 'OTHER' }, { name: 'tele.gif', cat: 'OTHER' },
    { name: 'online.webp', cat: 'OTHER' }, { name: 'footer.webp', cat: 'OTHER' },
    { name: 'icon-totowin88.ico', cat: 'OTHER' }
  ];

  function renderAssets(data) {
    const grid = document.getElementById('assetBody');
    grid.innerHTML = data.map(asset => `
      <div class="asset-card">
        <div style="display:flex; align-items:center; gap:12px;">
          <img src="${base}${asset.name}" class="preview-box">
          <span style="font-weight:700;">${asset.name}</span>
        </div>
        <button onclick="copyValue('${base}${asset.name}', this)" style="padding:8px 15px; border-radius:8px; border:1px solid #ddd; cursor:pointer;">Copy</button>
      </div>`).join('');
  }

  function copyValue(text, btn) {
    navigator.clipboard.writeText(text);
    btn.innerText = 'Copied!';
    setTimeout(() => { btn.innerText = 'Copy'; }, 1500);
  }

  window.onload = () => {
    setupAssets();
    setInterval(createRain, 300);
    checkAuth();
  };
</script>
</body>
</html>
