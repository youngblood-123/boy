<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Marketing YB - Pro v5.0</title>
  <style>
    :root {
      --primary: #2196F3;
      --success: #10b981;
      --bg: #f5f7fa;
      --container-bg: #ffffff;
      --text: #2c3e50;
      --text-muted: #64748b;
      --border: #f0f0f0;
      --card-hover: #f8fafc;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --container-bg: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
      --card-hover: #0f172a;
    }

    /* KODE AKSES GATE PRO */
    #access-gate {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .gate-card {
      background: var(--container-bg); padding: 40px; border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px;
    }
    .gate-input {
      width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid var(--border);
      background: var(--bg); color: var(--text); text-align: center; font-size: 16px; margin-bottom: 20px; outline: none;
    }
    .gate-btn {
      width: 100%; padding: 12px; border-radius: 12px; border: none;
      background: var(--primary); color: white; font-weight: 700; cursor: pointer;
    }
    .hidden { display: none !important; }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: all 0.2s ease; }
    body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; background: var(--container-bg); border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); padding: 25px; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    h1 { font-size: 24px; letter-spacing: -1px; background: linear-gradient(90deg, #2196F3, #00BCD4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .theme-toggle { cursor: pointer; padding: 8px 16px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--container-bg); color: var(--text); font-weight: 600; font-size: 12px; }

    .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
    .search-input { width: 100%; padding: 12px 20px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--container-bg); color: var(--text); outline: none; }

    .filter-buttons { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
    .btn-filter { padding: 6px 12px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--container-bg); color: var(--text); cursor: pointer; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .btn-filter.active { background: var(--primary); color: white; border-color: var(--primary); }

    .asset-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    @media (min-width: 768px) { .asset-grid { grid-template-columns: 1fr 1fr; } }

    .asset-card { background: var(--container-bg); border: 1px solid var(--border); border-radius: 15px; padding: 15px; display: flex; align-items: center; justify-content: space-between; }
    .asset-card:hover { border-color: var(--primary); transform: translateY(-2px); }

    .file-info { display: flex; align-items: center; gap: 12px; overflow: hidden; }
    .preview-box { width: 48px; height: 48px; border-radius: 10px; border: 1px solid var(--border); object-fit: contain; background: white; padding: 4px; flex-shrink: 0; }
    .file-name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .badge { padding: 3px 8px; border-radius: 5px; font-size: 9px; font-weight: 800; text-transform: uppercase; margin-top: 4px; width: fit-content; }
    .badge-bank { background: #dbeafe; color: #1e40af; }
    .badge-wallet { background: #fef9c3; color: #854d0e; }
    .badge-other { background: #f3e8ff; color: #6b21a8; }

    .action-group { display: flex; gap: 6px; }
    .btn-icon { padding: 8px 15px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--container-bg); color: var(--text-muted); cursor: pointer; font-size: 11px; font-weight: 700; }
    .copied { color: var(--success) !important; border-color: var(--success) !important; }

    footer { margin-top: 40px; text-align: center; color: var(--text-muted); font-size: 12px; }
  </style>
</head>
<body data-theme="light">

<div id="access-gate">
  <div class="gate-card">
    <div style="font-size: 40px; margin-bottom: 20px;">🔐</div>
    <h2>Secure Access</h2>
    <input type="password" id="gatePass" class="gate-input" placeholder="Enter Password">
    <button onclick="validateGate()" class="gate-btn">Unlock Dashboard</button>
  </div>
</div>

<div class="container">
  <header>
    <h1>Marketing Asset YB</h1>
    <div style="display: flex; gap: 10px;">
      <button onclick="logout()" class="theme-toggle" style="color: #ef4444;">Logout</button>
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">Dark Mode</button>
    </div>
  </header>

  <div class="controls">
    <input type="text" id="fileSearch" class="search-input" placeholder="Cari aset..." onkeyup="applyFilters()">
    <div class="filter-buttons">
        <button class="btn-filter active" onclick="setFilter('ALL', this)">All</button>
        <button class="btn-filter" onclick="setFilter('BANK', this)">BANK</button>
        <button class="btn-filter" onclick="setFilter('E-WALLET', this)">E-WALLET</button>
        <button class="btn-filter" onclick="setFilter('OTHER', this)">OTHER</button>
    </div>
  </div>

  <div class="asset-grid" id="assetBody"></div>

  <footer>
    <p>&copy; 2026 Crafted by <b>Young Blood Ops</b></p>
  </footer>
</div>

<script>
  // HASH SHA-256 DARI "YB2026"
  const SECURE_KEY = "854f871114d7de174c43b7ae5c4e2e49020a0b8f9ddc160bb395eaaf46047555";

  async function validateGate() {
    const input = document.getElementById('gatePass').value.trim();
    // Enkripsi input user ke SHA-256
    const msgBuffer = new TextEncoder().encode(input);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashedInput = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

    if(hashedInput === SECURE_KEY) {
      sessionStorage.setItem('yb_auth', 'true');
      document.getElementById('access-gate').classList.add('hidden');
      renderAssets(assets);
    } else {
      alert("Password Salah Bosku!");
    }
  }

  function checkAuth() {
    if(sessionStorage.getItem('yb_auth') === 'true') {
      document.getElementById('access-gate').classList.add('hidden');
      renderAssets(assets);
    }
  }

  function logout() {
    sessionStorage.removeItem('yb_auth');
    location.reload();
  }

  // --- DATA ASET ---
  const base = "https://youngblood-falsb9fy5y.edgeone.dev/";
  const assets = [
    { name: 'bca.webp', cat: 'BANK', b: 'badge-bank' },
    { name: 'bni.webp', cat: 'BANK', b: 'badge-bank' },
    { name: 'bri.webp', cat: 'BANK', b: 'badge-bank' },
    { name: 'cimb.webp', cat: 'BANK', b: 'badge-bank' },
    { name: 'mandiri.webp', cat: 'BANK', b: 'badge-bank' },
    { name: 'danamon.webp', cat: 'BANK', b: 'badge-bank' },
    { name: 'permata.webp', cat: 'BANK', b: 'badge-bank' },
    { name: 'dana.webp', cat: 'E-WALLET', b: 'badge-wallet' },
    { name: 'gopay.webp', cat: 'E-WALLET', b: 'badge-wallet' },
    { name: 'ovo.webp', cat: 'E-WALLET', b: 'badge-wallet' },
    { name: 'linkaja.webp', cat: 'E-WALLET', b: 'badge-wallet' },
    { name: 'qris.webp', cat: 'E-WALLET', b: 'badge-wallet' },
    { name: 'wa.gif', cat: 'OTHER', b: 'badge-other' },
    { name: 'tele.gif', cat: 'OTHER', b: 'badge-other' },
    { name: 'online.webp', cat: 'OTHER', b: 'badge-other' },
    { name: 'footer.webp', cat: 'OTHER', b: 'badge-other' },
    { name: 'icon-totowin88.ico', cat: 'OTHER', b: 'badge-other' }
  ];

  let currentCat = 'ALL';

  function renderAssets(data) {
    const grid = document.getElementById('assetBody');
    grid.innerHTML = data.map(asset => {
      const fullUrl = base + asset.name;
      return `
      <div class="asset-card">
        <div class="file-info">
          <img src="${fullUrl}" class="preview-box" loading="lazy">
          <div class="name-stack">
            <span class="file-name">${asset.name}</span>
            <span class="badge ${asset.b}">${asset.cat}</span>
          </div>
        </div>
        <div class="action-group">
          <button class="btn-icon" onclick="copyValue('${fullUrl}', this)">Copy</button>
          <a href="${fullUrl}" target="_blank" class="btn-icon" style="text-decoration:none; color:inherit; border:1px solid var(--border); padding:8px 15px; border-radius:8px;">Link</a>
        </div>
      </div>`;
    }).join('');
  }

  function setFilter(val, btn) {
    document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = val;
    applyFilters();
  }

  function applyFilters() {
    const query = document.getElementById('fileSearch').value.toLowerCase();
    const filtered = assets.filter(a => {
      const matchCat = currentCat === 'ALL' || a.cat === currentCat;
      const matchSearch = a.name.toLowerCase().includes(query);
      return matchCat && matchSearch;
    });
    renderAssets(filtered);
  }

  function toggleTheme() {
    const isDark = document.body.getAttribute('data-theme') === 'dark';
    document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('themeBtn').innerText = isDark ? 'Dark Mode' : 'Light Mode';
  }

  function copyValue(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      btn.innerText = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.innerText = 'Copy'; btn.classList.remove('copied'); }, 1500);
    });
  }

  // Izinkan tekan "Enter" untuk login
  document.getElementById('gatePass').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') validateGate();
  });

  window.onload = checkAuth;
</script>
</body>
</html>
